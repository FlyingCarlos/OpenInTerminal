name: Build and release OpenInTerminal

on:
  push:
    branches: [master]
    tags: ['v*-fork.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test shared preferences
        run: |
          xcodebuild -version
          bash Tests/SharedPreferences/run.sh
      - name: Build and sign
        run: bash build-unsigned.sh --full-only
      - name: Package universal app
        run: |
          app=export/OpenInTerminal.app
          extension="$app/Contents/PlugIns/OpenInTerminalFinderExtension.appex"
          helper="$app/Contents/Library/LoginItems/OpenInTerminalHelper.app"
          for executable in \
            "$app/Contents/MacOS/OpenInTerminal" \
            "$extension/Contents/MacOS/OpenInTerminalFinderExtension" \
            "$helper/Contents/MacOS/OpenInTerminalHelper"; do
            lipo -verify_arch arm64 x86_64 "$executable"
          done
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$app" release/OpenInTerminal.zip
          cd release
          shasum -a 256 OpenInTerminal.zip > OpenInTerminal.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenInTerminal
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenInTerminal
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check OpenInTerminal.zip.sha256
          gh release create "$GITHUB_REF_NAME" OpenInTerminal.zip OpenInTerminal.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag \
            --title "OpenInTerminal $GITHUB_REF_NAME"
